[project]
name = "ssr-env"
version = "0.1.0"
description = "Stephen's Sausage Roll simulator"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssr_env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
